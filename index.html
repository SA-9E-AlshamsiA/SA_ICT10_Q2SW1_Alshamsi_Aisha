<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Seatwork 1</title>

    <style>
        body {
            background-image: url("https://i.pinimg.com/736x/6d/4b/9a/6d4b9ab1a1646356017e397d5df92fd7.jpg"); /* chiikawa bg */
            background-color: #c7edff; /* just in case the image doesn't load */
            background-size: cover; /* makes the image stretch to fit the whole screen */
            background-position: center; /* keeps the middle of the image the middle */
            background-attachment: fixed; /* keeps it from moving when you scroll */
        }
        .card-box {
            /* the box that holds the form */
            background-color: #c7edff;  
            border: 3px solid #5c3d2e;                
            border-radius: 16px;
        }
        h3 { color: #5c3d2e; } /* turns the heading brown */
        .btn-blue {
            background-color: #a1e1ff;
            color: #5c3d2e;
        }
        .btn-blue:hover {
            background-color: #9fe1ff;
            color:#5c3d2e;
        }
        #result {
            /* the results box */
            background-color: #5c3d2e;   
            color: #c7edff;              
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card-box p-4">
            <h3 class="mb-4">ꨄ︎₊˚⊹ Chiikawa Club Members ₊˚⊹♡:</h3>
            <form class="mb-4">
                <div class="mb-3">
                    <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                </div>
                <div class="mb-3">
                    <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                </div>
                <input type="button" value="Submit" py-click="candidate_checker" class="btn btn-blue">
            </form>
            <div id="result" class="p-3 rounded"></div>
        </div>
    </div>

    <py-script src="main.py"></py-script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
